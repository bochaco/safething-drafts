services:
  app_proxy:
    environment:
      APP_HOST: safething-drafts-formicaio_formicaio_proxy_1
      APP_PORT: 52200
    container_name: safething-drafts-formicaio_app_proxy_1
  formicaio_proxy:
    image: bochaco/formicaio_proxy:0.3.0@sha256:49a8f7b1787aa356c9c444fe75b90fbd09da4d9a0be00c3f753e997a3196e1f9
    user: 1000:1000
    environment:
      FORMICAIO_ADDR: host.docker.internal:52201
      FORMICAIO_PROXY_PORT: 52200
    extra_hosts:
      - host.docker.internal:host-gateway
    container_name: safething-drafts-formicaio_formicaio_proxy_1
  formicaio:
    image: bochaco/formicaio:0.8.3-native
    privileged: true
    restart: on-failure
    network_mode: host
    stop_grace_period: 5s
    environment:
      DB_PATH: /data
      NODE_MGR_ROOT_DIR: /data
      LEPTOS_SITE_ADDR: 0.0.0.0:52201
    volumes:
      - ${APP_DATA_DIR}/data/formicaio:/data
    devices:
      - /dev:/dev
    container_name: safething-drafts-formicaio_formicaio_1
