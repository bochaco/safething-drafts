services:
  app_proxy:
    environment:
      APP_HOST: safething-drafts-formicaio_formicaio_proxy_1
      APP_PORT: 52200
    container_name: safething-drafts-formicaio_app_proxy_1
  formicaio_proxy:
    image: bochaco/formicaio_proxy:latest
    environment:
      FORMICAIO_ADDR: host.docker.internal:52201
      FORMICAIO_PROXY_PORT: 52200
    extra_hosts:
      - host.docker.internal:host-gateway
    container_name: safething-drafts-formicaio_formicaio_proxy_1
  formicaio:
    image: bochaco/formicaio:latest-native
    privileged: true
    restart: on-failure
    network_mode: host
    stop_grace_period: 5s
    environment:
      DB_PATH: /data
      NODE_MGR_ROOT_DIR: /data
      LEPTOS_SITE_ADDR: 0.0.0.0:52201
    volumes:
      - ${APP_DATA_DIR}/data/formicaio:/data
    devices:
      - /dev:/dev
    container_name: safething-drafts-formicaio_formicaio_1
